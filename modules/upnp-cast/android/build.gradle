// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.upnpcast'
version = '0.0.1'

android {
  namespace "expo.modules.upnpcast"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // SSDP discovery + AVTransport control (the modern stand-in for Cling).
  implementation "com.yinnho.upnpcast:upnpcast:1.1.2"
}
