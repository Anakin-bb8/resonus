// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.homewidget'
version = '0.0.1'

android {
  namespace "expo.modules.homewidget"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // ShortcutManagerCompat; the widget and the tile are the framework's.
  implementation "androidx.core:core:1.18.0"
}
