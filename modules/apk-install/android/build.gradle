// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.apkinstall'
version = '0.0.1'

android {
  namespace "expo.modules.apkinstall"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // `FileProvider`, to hand the installer a content:// it is allowed to read.
  // A file:// would be a FileUriExposedException since Nougat.
  implementation "androidx.core:core-ktx:1.13.1"
}
