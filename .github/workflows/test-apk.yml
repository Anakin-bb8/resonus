name: Test APK

# The same signed APK as a release, from any branch, without a tag and without
# a release. It is left as a workflow artifact, which anybody can download from
# the run's page.
#
# Chasing a bug with somebody means handing them build after build, and each of
# those does not belong on the releases page: a beta is meant to be something a
# lot of people try, not the fourth attempt at a fix that only one person can
# reproduce. Run it from the Actions tab, pick the branch, send the link.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'What this build is for (shows in the run title)'
        required: false
        default: ''

run-name: Test APK · ${{ github.ref_name }} ${{ inputs.note }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild (Android)
        run: pnpm expo prebuild --clean -p android

      # Signed with the same key as a release, so it installs over one instead
      # of asking to uninstall first. That is the whole point of a test build:
      # keeping the downloads and the offline copy that the bug needs.
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          # Stamped into the bundle so the diagnostics screen can say which
          # build a report came from: a test APK carries the same version as
          # the release it was branched from.
          EXPO_PUBLIC_COMMIT: ${{ github.sha }}
          RESONUS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RESONUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RESONUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RESONUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name it after the commit
        run: cp android/app/build/outputs/apk/release/app-release.apk "resonus-test-${GITHUB_SHA::7}.apk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: resonus-test-${{ github.sha }}
          path: resonus-test-*.apk
          # Long enough to chase something over a few days, short enough not to
          # leave signed builds lying around for ever.
          retention-days: 14
