name: Translations

# Checks a translation pull request the moment it is pushed, instead of three
# days later when somebody gets round to reading it. A stray comma, a key that
# no longer exists, a {placeholder} lost in translation: all of it is knowable
# straight away, and waiting to be told is the part of contributing that puts
# people off.
#
# Node and nothing else. These scripts read the repo, not the app, and import
# only what Node ships with, so there is no install and nothing to cache — the
# first version asked for the pnpm cache anyway and failed on the way out,
# looking for a store directory that nothing had created.

on:
  pull_request:
    paths:
      - 'src/i18n/**'
      - 'scripts/i18n-*.mjs'
      - 'docs/TRANSLATION-CONTEXT.md'
      - '.github/workflows/i18n.yml'
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'
      - 'scripts/i18n-*.mjs'
      - 'docs/TRANSLATION-CONTEXT.md'
      - '.github/workflows/i18n.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/i18n-check.mjs
      - name: Where each language stands
        if: always()
        run: node scripts/i18n-status.mjs
