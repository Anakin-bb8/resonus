name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS)
        run: pnpm expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Find workspace
        id: xcode
        working-directory: ios
        run: |
          WS=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n1 | sed 's|^\./||')
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "Resonus" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Resonus.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO

      - name: Package IPA
        run: |
          # Search for the .app file inside the Products directory of the archive
          APP_PATH=$(find ios/build/Resonus.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: Unable to find the .app file inside Products/."
            echo "Archive contents:"
            ls -R ios/build/Resonus.xcarchive/Products || true
            exit 1
          fi

          echo "App found in: $APP_PATH"

          # Prepare the Payload directory and create the unsigned IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "resonus.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonus.ipa
          path: resonus.ipa
          retention-days: 14
