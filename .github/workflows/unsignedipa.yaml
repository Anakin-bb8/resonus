name: Build unsigned iOS IPA

# Runs on demand, and alongside the APK when a v* tag is pushed. The IPA is
# unsigned (there is no Apple account behind it), so it is not App Store
# material: it goes into the same draft Release as the APK, for sideloading.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The lock screen's animated cover lives behind `#if compiler(>=6.2)`
      # (Swift 6.2 ships with Xcode 26), and this image defaults to Xcode 16.4:
      # with it the whole feature compiles away without a single warning, the
      # build succeeds, and the cover stays static. Xcode 26 is installed, it
      # just has to be the one xcodebuild runs.
      - name: Select Xcode 26
        run: |
          CURRENT=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "Default Xcode: $CURRENT"
          PICK=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$PICK" ]; then
            if [ "$PICK" != "$CURRENT" ]; then
              echo "Selecting $PICK"
              sudo xcode-select -s "$PICK"
            fi
          else
            echo "::warning::No Xcode 26 on this runner: the lock screen's animated cover compiles out"
          fi
          xcodebuild -version

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS)
        run: pnpm expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Find workspace
        id: xcode
        working-directory: ios
        run: |
          WS=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n1 | sed 's|^\./||')
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        working-directory: ios
        env:
          # Same stamp the APK carries, so a report from a sideloaded build says
          # which commit it came from (see the diagnostics screen).
          EXPO_PUBLIC_COMMIT: ${{ github.sha }}
        run: |
          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "Resonus" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Resonus.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO

      # Proves the compiled binary really carries the animated artwork code:
      # "animated-artwork" is the cache folder its Swift writes, so it is only
      # in the executable when the `#if compiler(>=6.2)` branch was compiled.
      - name: Check animated artwork is compiled in
        run: |
          APP_PATH=$(find ios/build/Resonus.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -n1)
          if [ -n "$APP_PATH" ] && grep -Raq "animated-artwork" "$APP_PATH"; then
            echo "Animated artwork code is in the binary."
          else
            echo "::warning::Animated artwork code is NOT in the binary (Xcode older than 26?)"
          fi

      - name: Package IPA
        run: |
          # Search for the .app file inside the Products directory of the archive
          APP_PATH=$(find ios/build/Resonus.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: Unable to find the .app file inside Products/."
            echo "Archive contents:"
            ls -R ios/build/Resonus.xcarchive/Products || true
            exit 1
          fi

          echo "App found in: $APP_PATH"

          # Prepare the Payload directory and create the unsigned IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "resonus-${GITHUB_REF_NAME}.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonus-ipa
          path: resonus-*.ipa
          retention-days: 14

      # The draft belongs to the APK workflow, which takes longer than this one.
      # Waiting for it is what keeps this from opening a second Release for the
      # same tag.
      - name: Attach the IPA to the draft Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 90); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" "resonus-${GITHUB_REF_NAME}.ipa" --clobber
