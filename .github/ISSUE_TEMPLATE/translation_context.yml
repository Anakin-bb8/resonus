name: "Translation: a string isn't clear"
description: Ask what a string means, so the answer ends up in the repo
title: "[i18n]: "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        Asking here rather than on Discord is worth the extra minute: the answer
        becomes a line in `src/i18n/context.jsonc`, and from then on every
        translator of every language is shown it next to the string.

        Before asking, the answer may already be there:
        [docs/TRANSLATION-CONTEXT.md](https://github.com/juananzzz/resonus/blob/main/docs/TRANSLATION-CONTEXT.md)
        lists every string under the screen it shows up on.
  - type: textarea
    id: strings
    attributes:
      label: Which strings
      description: The English text, exactly as it is in `en.json`. As many as you like.
      placeholder: |
        "Direction"
        "Not used"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: The one you are translating into.
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What is unclear
      description: "What you cannot tell from the string alone: which of two meanings, what part of speech, what it refers to."
    validations:
      required: false
