name: Bug report
description: Something isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Resonus version
      description: Under Settings › About. If it isn't the latest [release](https://github.com/juananzzz/resonus/releases), please try that one first.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Description
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Tap…
        3. See…
    validations:
      required: false
  - type: dropdown
    id: server
    attributes:
      label: Server
      description: Pick every one you use. If it only goes wrong on one of them, say so in the description.
      multiple: true
      options:
        - Navidrome
        - Jellyfin
        - Ampache
        - Other OpenSubsonic
        - Local (no server)
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Mode
      description: Optional. Whether it goes wrong with a connection, with "Offline mode" on in Settings, or either way.
      options:
        - "Online"
        - "Offline"
        - "Both"
    validations:
      required: false
